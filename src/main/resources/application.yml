spring:
  application:
    name: job-hunter-scraper
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
scraper:
  enabled: ${SCRAPER_ENABLED:false}
  sources: ${SCRAPER_SOURCES:djinni,dou,euremotejobs,justjoinit,landingjobs,linkedin,nofluffjobs,web3career}
  worker-id: ${HOSTNAME:local}
  poll-interval: ${SCRAPER_POLL_INTERVAL:15s}
  max-parallel-sources: ${SCRAPER_MAX_PARALLEL_SOURCES:8}
  max-pages: ${SCRAPER_MAX_PAGES:1000}
  heartbeat-interval: ${SCRAPER_HEARTBEAT_INTERVAL:30s}
  http-timeout: ${SCRAPER_HTTP_TIMEOUT:30s}
  http-attempts: ${SCRAPER_HTTP_ATTEMPTS:3}
  retry-delay: ${SCRAPER_RETRY_DELAY:1s}
  max-retry-delay: ${SCRAPER_MAX_RETRY_DELAY:2m}
  max-response-bytes: ${SCRAPER_MAX_RESPONSE_BYTES:16777216}
job-hunter:
  api-url: ${JOB_HUNTER_API_URL:http://localhost:8081}
  auth-enabled: ${JOB_HUNTER_AUTH_ENABLED:true}
  token-url: ${AUTHENTIK_TOKEN_URL:https://auth.gaynance.com/application/o/token/}
  client-id: ${JOB_HUNTER_CLIENT_ID:}
  username: ${JOB_HUNTER_USERNAME:}
  password: ${JOB_HUNTER_PASSWORD:}
  scope: ${JOB_HUNTER_SCOPE:profile job-hunter-api}
  max-retry-delay: ${JOB_HUNTER_MAX_RETRY_DELAY:2m}
logging:
  structured:
    format:
      console: ecs
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mshykhov.jobhunterscraper: ${LOG_LEVEL_APP:INFO}
